# Head-to-head of sml.rs scheduler policies against hsm.rs's queued
# `dispatch` on the CD-player workload. A separate workspace keeps hsm.rs out
# of the published crate's dependency, lint, and license gates.
# Paths assume the stateforward layout: sml/sml.rs next to hsm/hsm.rs.
[package]
name = "sml-scheduler-compare"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
sml = { package = "stateforward-sml", path = "../..", features = ["tokio"] }
hsm = { package = "rust", path = "../../../../hsm/hsm.rs", features = ["tokio"] }
smol = "2"
tokio = { version = "1.54", default-features = false, features = ["rt", "rt-multi-thread", "sync"] }

[profile.release]
codegen-units = 1
lto = true

[workspace]
