[package]
name = "sml-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sml = { package = "stateforward-sml", path = ".." }

[[bin]]
name = "runtime_utilities"
path = "fuzz_targets/runtime_utilities.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
warnings = "deny"

[lints.clippy]
all = "deny"
cargo = "deny"
pedantic = "deny"
nursery = "deny"
allow-attributes-without-reason = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
float_cmp = "deny"
float_arithmetic = "deny"
get_unwrap = "deny"
infinite_loop = "deny"
indexing_slicing = "deny"
integer_division = "deny"
integer_division_remainder_used = "deny"
large_stack_arrays = "deny"
let_underscore_must_use = "deny"
lossy_float_literal = "deny"
mem_forget = "deny"
mixed_read_write_in_expression = "deny"
modulo_arithmetic = "deny"
option_env_unwrap = "deny"
panicking_overflow_checks = "deny"
panic = "deny"
panic_in_result_fn = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unseparated_literal_suffix = "deny"
transmute_ptr_to_ptr = "deny"
transmute_undefined_repr = "deny"
uninit_assumed_init = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
